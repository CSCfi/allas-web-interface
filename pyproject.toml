[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swift-browser-ui"
dynamic = ["version"]
description = "Object browser Web UI for Openstack Swift API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "CSC Developers" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "aiohttp-session==2.12.1",
    "aiohttp==3.14.1",
    "redis==8.0.1",
    "asyncpg==0.31.0",
    "certifi==2026.6.17",
    "click==8.4.2",
    "cryptography==49.0.0",
    "gunicorn==26.0.0",
    "keystoneauth1==5.15.0",
    "idpyoidc==5.0.0",
    "uvloop==0.22.1",
    "msgpack==1.2.1",
    "ldap3==2.9.1",
    "aioboto3==15.5.0",
    "setuptools==83.0.0",
    "statsd==4.0.1",
]

[project.optional-dependencies]
test = [
    "black==26.5.1",
    "coverage==7.15.1",
    "flake8-docstrings==1.7.0",
    "flake8==7.3.0",
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
    "tox==4.56.4",
    "setuptools==83.0.0",
]
ui_test = [
    "pytest-timeout==2.4.0",
    "pytest==9.1.1",
]
dev = [
    "honcho==2.0.0",
    "pre-commit==4.6.0",
    "pyspelling==2.12.1",
    "ruff==0.15.21",
    "types-certifi",
    "types-redis",
    "types-requests",
]

[project.scripts]
swift-browser-ui = "swift_browser_ui.launcher:run_ui"
swift-x-account-sharing = "swift_browser_ui.launcher:run_sharing"

[project.urls]
Source = "https://github.com/CSCfi/swift-browser-ui"

[tool.hatch.version]
path = "swift_browser_ui/__init__.py"

[tool.black]
line-length = 90
target-version = ['py312']

[tool.isort]
atomic = true
profile = "black"
line_length = 90
py_version=312

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    # "ANN",   # flake8-annotations
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "D",   # pydocstyle
#    "UP",  # pyupgrade
    "S",   # Bandit
]

ignore = [
    "E501",    # line too long, handled by black
    "B904",    # do not perform function calls in argument defaults
    "PLR2004", # magic value used in comparison
    "S113",    # Probable use of requests call without timeout
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
]

[tool.ruff.lint.mccabe]
max-complexity = 15
